[package]
name = "crm-desktop"
version = "0.1.0"
description = "CRM de escritorio local-first para comercios y servicios en Suiza"
edition = "2024"
publish = false

[lib]
# El sufijo `_lib` evita un choque de nombres con el binario en Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "crm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
getrandom = "0.4"
thiserror = "2.0.21"
zeroize = "1.9.1"

# Guía de tamaño: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3.27.0"
